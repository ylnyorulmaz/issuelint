name: Cloudflare live smoke test

# Intentionally manual: a main push starts the Workers Build asynchronously.
# Checking immediately on push can report the PREVIOUS deployment as successful.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm deployed 2.5 assets, private API gate and verifier config
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://issuelint.com"
          curl -fsS --max-time 20 "$BASE/" -o /tmp/issue.html
          grep -q '<div id="root"></div>' /tmp/issue.html
          JS_PATH=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/issue.html | head -n1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          curl -fsS --max-time 20 "$BASE$JS_PATH" -o /tmp/issue.js
          grep -q 'Private AI access code' /tmp/issue.js
          grep -q 'Forget code' /tmp/issue.js
          curl -fsS --max-time 20 "$BASE/api/health" | node -e '
            let text="";
            process.stdin.on("data", chunk => text+=chunk);
            process.stdin.on("end", () => {
              const x=JSON.parse(text);
              if(x.status!=="ok" || x.iteration!==5 || x.reviewEngineVersion!=="2.5" ||
                 !x.aiBindingConfigured || !x.aiEnabled || !x.feedbackVerifierConfigured ||
                 x.feedbackVerifierMode!=="on") process.exit(1);
              console.log("Live IssueLint 2.5 ready for private AI testing");
            });
          '
          STATUS=$(curl -sS -o /tmp/issue-api.json -w '%{http_code}' --max-time 20 \
            -X POST "$BASE/api/analyze" -H 'content-type: application/json' \
            -d '{"title":"Test","description":"Check","type":"General","domain":"Other"}')
          test "$STATUS" = "401"
          echo "Unauthenticated review rejected with HTTP 401"
