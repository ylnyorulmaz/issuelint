<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IssueLint Clipper</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://issuelint.com" target="_blank" rel="noopener noreferrer" aria-label="IssueLint (opens issuelint.com)">
        <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M7 3.5H3.5v17H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" />
          <path d="M17 3.5h3.5v17H17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" />
          <path class="brand-bars" d="M7.5 8.5h9M7.5 12h9M7.5 15.5h9" stroke-width="1.9" />
        </svg>
        <span class="wordmark"><span class="wm-issue">Issue</span><span class="wm-lint">Lint</span></span>
      </a>
      <div class="topbar-actions">
        <button id="reextract" class="icon-btn" type="button" title="Re-extract the active tab" aria-label="Re-extract">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="settings-toggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="subbar">
      <span class="kicker">Clip → Review</span>
      <span id="backend-badge" class="pill"><i class="dot"></i><span id="backend-badge-text"></span></span>
      <span id="mock-badge" class="pill pill-mock" hidden><i class="dot"></i>Mock</span>
    </div>
    <div class="urlrow">
      <span id="url-badge" class="url-badge" title="">No page extracted yet</span>
    </div>

    <section id="settings" class="card settings" hidden aria-labelledby="settings-heading">
      <div class="card-kicker"><span class="kicker" id="settings-heading">Settings</span></div>
      <form id="settings-form" novalidate>
        <label class="field">
          <span class="field-label">Backend</span>
          <select id="mode">
            <option value="quick_scan">IssueLint · Quick Scan</option>
            <option value="analyze_v2">IssueLint · Analyze v2 (Decision)</option>
            <option value="custom">Custom endpoint</option>
          </select>
        </label>
        <label class="field" id="server-url-field">
          <span class="field-label">IssueLint server</span>
          <input id="server-url" type="url" placeholder="https://issuelint.com" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field" id="api-url-field" hidden>
          <span class="field-label">API URL</span>
          <input id="api-url" type="url" placeholder="https://your-backend.example/api/clip" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field-label" id="api-key-label">Preview access code</span>
          <div class="input-row">
            <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
            <button id="api-key-reveal" class="btn btn-ghost btn-small" type="button" aria-pressed="false">Show</button>
          </div>
          <small class="hint">Sent as a Bearer token. Stored only on this device (not synced).</small>
        </label>
        <p id="privacy-hint" class="hint privacy"></p>
        <label class="switch">
          <input id="mock-mode" type="checkbox" />
          <span class="switch-track" aria-hidden="true"></span>
          <span>Mock mode <em>— return sample data, never call the API</em></span>
        </label>
        <div class="row">
          <button class="btn btn-primary btn-small" type="submit">Save</button>
          <span id="settings-status" class="status-text" role="status"></span>
        </div>
      </form>
    </section>

    <div id="notice" class="notice" role="alert" hidden>
      <p id="notice-text"></p>
      <div class="row">
        <button id="notice-action" class="btn btn-small" type="button" hidden></button>
      </div>
    </div>

    <main>
      <section class="card" aria-labelledby="extract-heading">
        <div class="card-head">
          <span class="step" aria-hidden="true">01</span>
          <h2 id="extract-heading" class="kicker"><span class="sr-only">01 </span>Extract</h2>
          <button id="pick" class="pick-btn" type="button" aria-pressed="false"
            title="Pick a card or area on the page. Hold Shift for the exact element; Esc cancels.">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="1.6" fill="currentColor" />
              <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <span id="pick-label">Pick card</span>
          </button>
        </div>
        <div class="segmented" role="group" aria-label="Extraction source">
          <span class="seg" data-mode="selection">Selection</span>
          <span class="seg" data-mode="modal">Modal</span>
          <span class="seg" data-mode="card">Card</span>
          <span class="seg" data-mode="page">Full Page</span>
        </div>
        <p id="page-title" class="page-title"></p>
        <textarea id="markdown" spellcheck="false" placeholder="Re-extract (↻) or click the toolbar icon to clip the current page. Select text first to clip only the selection, or use Pick card to click one card or area." aria-label="Extracted Markdown"></textarea>
        <p id="limit-hint" class="limit-hint" role="status" hidden></p>
        <div class="meta-row">
          <span id="char-count" class="char-count" aria-live="polite"></span>
          <span id="copy-status" class="status-text" role="status"></span>
          <button id="copy" class="text-btn" type="button" disabled>Copy</button>
        </div>
      </section>

      <div class="analyze-bar">
        <button id="analyze" class="btn btn-primary btn-block" type="button" disabled>Analyze Task</button>
        <button id="cancel" class="btn btn-ghost" type="button" hidden>Cancel</button>
      </div>

      <section id="results" class="card results" hidden aria-live="polite" aria-busy="false" aria-label="Review and findings"></section>
    </main>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
